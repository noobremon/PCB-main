# ⚠️ OPTIONAL: Blueprint Configuration for Render
# 
# This file allows deploying both services at once using Render Blueprints.
# However, you can also deploy manually through the Render dashboard:
#   1. Deploy backend as a Web Service
#   2. Deploy frontend as a Static Site
#
# For manual deployment instructions, see DEPLOYMENT.md or QUICKSTART.md
#
# To use this Blueprint:
#   1. Go to Render Dashboard
#   2. Click "New +" → "Blueprint"
#   3. Connect your repository
#   4. Render will create both services automatically

services:
  # Backend API Service
  - type: web
    name: pcb-inspection-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: pcb_inspection
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_SIZE
        value: 10485760
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: pcb-inspection-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
